# NOTE: for a real production cluster, secrets like this would be created via
# `kubectl create secret` or a secrets manager, not committed to git.
# Committing it here is fine only because these are throwaway local-dev values.
apiVersion: v1
kind: Secret
metadata:
  name: todo-secrets
  namespace: todo-app
type: Opaque
stringData:
  POSTGRES_PASSWORD: todo
  DATABASE_URL: postgres://todo:todo@db:5432/todo
